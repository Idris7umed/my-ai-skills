<!DOCTYPE html>
<!--
  My Designer carousel template.
  1. Set <html lang dir>: lang="ar" dir="rtl"  |  lang="en" dir="ltr".  (mixed mode = ar/rtl)
  2. Set the size class on <body>: size-portrait (1080x1350) | size-square (1080x1080) | size-story (1080x1920)
  3. Set the brand tokens in :root.
  4. Duplicate <section class="slide"> per slide. Layout markup: references/layouts.md
  5. Mark text blocks data-qa="text"; shapes that must stay clear of text data-qa="visual";
     full-bleed textures and soft glows that may sit behind text data-qa="bg". render.py uses these.

  brand.json format (save one after the first carousel):
  { "name": "...", "handle": "@...", "logo": "logo.png or null",
    "bg": "#12101C", "surface": "#1D1A2B", "text": "#F4F1EA", "muted": "#9C97AD", "accent": "#A78BFA",
    "font_ar": "Cairo", "font_en": "Inter", "numerals": "western | arabic-indic",
    "dialect": "gulf | egyptian | levantine | maghrebi | msa", "tone_en": "casual | professional" }
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>carousel</title>
<style>
@font-face { font-family: "Cairo"; src: url("fonts/Cairo.ttf") format("truetype"); font-weight: 200 1000; font-display: block; }
@font-face { font-family: "Inter"; src: url("fonts/Inter.ttf") format("truetype"); font-weight: 100 900; font-display: block; }

:root {
  /* ===== BRAND TOKENS ===== */
  --bg: #12101C;
  --surface: #1D1A2B;      /* cards, chips */
  --text: #F4F1EA;
  --muted: #9C97AD;        /* labels, counter */
  --accent: #A78BFA;
  --line: rgba(255,255,255,.07); /* grid lines, borders */
  --font-ar: "Cairo";
  --font-en: "Inter", "Cairo";
  /* ======================== */
  --w: 1080px; --h: 1350px; --m: 80px;
}
body.size-square  { --h: 1080px; }
body.size-story   { --h: 1920px; }

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #555; display: flex; flex-direction: column; align-items: center; gap: 40px; padding: 40px 0; }

/* ---------- fonts per language ---------- */
html[lang="ar"] .slide { font-family: var(--font-ar), sans-serif; }
html[lang="en"] .slide { font-family: var(--font-en), sans-serif; }
.slide :lang(en) { font-family: var(--font-en), sans-serif; }
.slide :lang(ar) { font-family: var(--font-ar), sans-serif; }

/* ---------- slide frame ---------- */
.slide {
  width: var(--w); height: var(--h); position: relative; overflow: hidden;
  background: var(--bg); color: var(--text);
}
.safe {
  position: absolute; inset: 190px var(--m) 190px var(--m);
  display: flex; flex-direction: column; justify-content: center; gap: 28px;
  overflow: hidden; z-index: 2;
}
.safe.top { justify-content: flex-start; }

/* ---------- brand bar (logical props => mirrors in RTL) ---------- */
.bar { position: absolute; inset-inline: var(--m); display: flex; justify-content: space-between; align-items: center; z-index: 3; }
.bar.top { top: var(--m); }
.bar.bottom { bottom: var(--m); }
.pill { font-size: 32px; font-weight: 700; color: var(--text); background: var(--surface); padding: 6px 26px 10px; border-radius: 999px; border: 2px solid var(--line); }
.counter { font-size: 32px; font-weight: 700; color: var(--muted); font-family: var(--font-en), sans-serif; unicode-bidi: isolate; }
.mark { font-size: 32px; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 14px; }
.mark img { height: 52px; width: auto; }
.swipe { font-size: 32px; font-weight: 800; color: var(--accent); display: flex; align-items: center; gap: 10px; }
.swipe .arrow::after { content: "\2192"; font-family: var(--font-en), sans-serif; }
html[dir="rtl"] .swipe .arrow::after { content: "\2190"; }
.slide.last .swipe { display: none; }

/* ---------- type ---------- */
.label { font-size: 40px; font-weight: 700; color: var(--muted); }
.h-cover { font-size: 124px; font-weight: 900; }
.h-xl    { font-size: 108px; font-weight: 900; }
.h-l     { font-size: 92px;  font-weight: 900; }
.h-m     { font-size: 76px;  font-weight: 900; }
.body    { font-size: 46px; font-weight: 600; line-height: 1.55; color: var(--text); opacity: .9; }
.sub     { font-size: 44px; font-weight: 600; color: var(--muted); line-height: 1.45; }
.source  { font-size: 26px; font-weight: 500; color: var(--muted); opacity: .8; margin-top: 8px; }
html[lang="ar"] .h-cover, html[lang="ar"] .h-xl, html[lang="ar"] .h-l, html[lang="ar"] .h-m { line-height: 1.3; letter-spacing: 0; }
html[lang="en"] .h-cover, html[lang="en"] .h-xl, html[lang="en"] .h-l, html[lang="en"] .h-m { line-height: 1.04; letter-spacing: -0.03em; }
html[lang="ar"] .slide :lang(en).sub { font-size: 38px; letter-spacing: 0; } /* mixed-mode English subline */
.center { text-align: center; align-items: center; }

/* ---------- highlight with hand-drawn underline ---------- */
.hl { color: var(--accent); position: relative; display: inline-block; white-space: nowrap; }
.hl::after {
  content: ""; position: absolute; inset-inline: -3%; bottom: -0.06em; height: 0.2em; background: var(--accent);
  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 24' preserveAspectRatio='none'><path d='M4 16 C 45 7, 110 5, 196 11' stroke='black' stroke-width='7' fill='none' stroke-linecap='round'/></svg>") center / 100% 100% no-repeat;
          mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 24' preserveAspectRatio='none'><path d='M4 16 C 45 7, 110 5, 196 11' stroke='black' stroke-width='7' fill='none' stroke-linecap='round'/></svg>") center / 100% 100% no-repeat;
}

/* ---------- content layouts ---------- */
.cards { display: grid; gap: 24px; }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 36px; padding: 36px 40px; display: flex; gap: 28px; align-items: center; }
.card .ico { flex: none; width: 88px; height: 88px; border-radius: 26px; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); display: grid; place-items: center; }
.card .ico svg { width: 50px; height: 50px; }
.card h3 { font-size: 52px; font-weight: 800; line-height: 1.3; }
.card p { font-size: 38px; font-weight: 600; color: var(--muted); line-height: 1.45; }

.numlist { display: grid; gap: 30px; list-style: none; }
.numlist li { display: flex; gap: 30px; align-items: baseline; font-size: 56px; font-weight: 800; line-height: 1.35; }
.numlist .n { flex: none; font-family: var(--font-en), sans-serif; font-size: 44px; font-weight: 900; color: var(--accent); min-width: 72px; }

.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.compare > div { border-radius: 40px; padding: 48px 40px; min-height: 420px; background: var(--surface); border: 2px solid var(--line); }
.compare .tag { font-size: 40px; font-weight: 800; margin-bottom: 18px; display: block; }
.compare .before .tag { color: var(--muted); }
.compare .after { border-color: var(--accent); }
.compare .after .tag { color: var(--accent); }
.compare p { font-size: 50px; font-weight: 700; line-height: 1.45; }

.chips { display: flex; flex-wrap: wrap; gap: 20px; }
.chip { font-size: 40px; font-weight: 700; padding: 14px 34px 18px; border-radius: 999px; background: var(--surface); border: 2px solid var(--line); }
.chip.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }

.steps { display: grid; gap: 0; }
.step { display: grid; grid-template-columns: 100px 1fr; gap: 34px; padding-bottom: 48px; position: relative; }
.step .dot { width: 100px; height: 100px; border-radius: 50%; border: 5px solid var(--accent); display: grid; place-items: center; font-family: var(--font-en), sans-serif; font-size: 42px; font-weight: 900; color: var(--accent); background: var(--bg); z-index: 1; }
.step:not(:last-child)::before { content: ""; position: absolute; inset-inline-start: 48px; top: 100px; bottom: 0; width: 4px; background: var(--line); }
.step h3 { font-size: 60px; font-weight: 800; line-height: 1.3; }
.step p { font-size: 42px; font-weight: 600; color: var(--muted); line-height: 1.45; }

.bignum { font-family: var(--font-en), sans-serif; font-size: 300px; font-weight: 900; line-height: .9; color: var(--accent); letter-spacing: -0.04em; }

.cta-key { display: inline-block; font-size: 64px; font-weight: 900; color: var(--bg); background: var(--accent); padding: 12px 56px 22px; border-radius: 28px; }
.cta-mark { font-size: 54px; font-weight: 800; color: var(--text); }
.cta-mark img { height: 120px; }

/* ---------- visuals (decorative, data-qa="visual") ---------- */
.v { position: absolute; pointer-events: none; z-index: 1; }
.v-grid { inset: 0; background-image: linear-gradient(var(--line) 2px, transparent 2px), linear-gradient(90deg, var(--line) 2px, transparent 2px); background-size: 108px 108px; }
.v-glow { width: 760px; height: 760px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 38%, transparent) 0%, transparent 65%); }
.v-circles { width: 620px; height: 620px; border-radius: 50%; background: repeating-radial-gradient(circle, transparent 0 46px, color-mix(in srgb, var(--accent) 35%, transparent) 46px 50px); }
.v-arch { width: 460px; height: 600px; border-radius: 230px 230px 0 0; border: 6px solid var(--accent); border-bottom: 0; opacity: .5; }
.v-sun { width: 720px; height: 360px; border-radius: 360px 360px 0 0; background: linear-gradient(color-mix(in srgb, var(--accent) 70%, transparent), transparent); }
.v-tri { width: 0; height: 0; border-inline: 300px solid transparent; border-bottom: 520px solid color-mix(in srgb, var(--accent) 22%, transparent); }
.v-stripes { width: 560px; height: 560px; background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--accent) 30%, transparent) 0 18px, transparent 18px 44px); border-radius: 40px; }
.v-dotgrid { width: 460px; height: 460px; background-image: radial-gradient(color-mix(in srgb, var(--accent) 55%, transparent) 5px, transparent 6px); background-size: 46px 46px; }
.v-stack { width: 440px; height: 300px; }
.v-stack i { position: absolute; inset: 0; border-radius: 36px; background: var(--surface); border: 3px solid var(--accent); }
.v-stack i:nth-child(1) { transform: rotate(-10deg) translate(-30px, 20px); opacity: .4; }
.v-stack i:nth-child(2) { transform: rotate(-4deg); opacity: .7; }
.v-dots { display: flex; gap: 22px; position: static; }
.v-dots i { width: 64px; height: 64px; border-radius: 50%; display: block; }
/* corner helpers (logical => mirror in RTL) */
.at-top-end    { top: -120px; inset-inline-end: -160px; }
.at-top-start  { top: -120px; inset-inline-start: -160px; }
.at-bot-end    { bottom: -140px; inset-inline-end: -160px; }   /* bottom corners overlap handle/swipe: prefer top corners for big shapes */
.at-bot-start  { bottom: -140px; inset-inline-start: -160px; }
.at-bot-center { bottom: 0; left: 50%; transform: translateX(-50%); }
</style>
</head>
<body class="size-portrait">

<!-- reusable icons: <svg><use href="#i-check"/></svg> -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="currentColor"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M12 7v5l3.5 2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="currentColor"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0012 3z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-9.3-9.2C1.5 7.4 3.8 4 7.2 4c2 0 3.6 1.1 4.8 2.8C13.2 5.1 14.8 4 16.8 4c3.4 0 5.7 3.4 4.5 6.8C19.5 15.4 12 20 12 20z" fill="currentColor"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2.5l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10v-6z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<!-- ===== EXAMPLE: cover ===== -->
<section class="slide" data-layout="cover-question">
  <div class="v v-grid" data-qa="bg"></div>
  <div class="v v-glow at-top-end" data-qa="bg"></div>
  <header class="bar top"><span class="pill" data-qa="text">تقنية</span><bdi dir="ltr" class="counter">1 / 7</bdi></header>
  <div class="safe center">
    <p class="label" data-qa="text">مصطلحات بسيطة</p>
    <h1 class="h-cover" data-qa="text">وش يعني <span class="hl"><bdi>API</bdi></span>؟</h1>
    <p class="sub" data-qa="text">شرح بدون تعقيد</p>
  </div>
  <footer class="bar bottom"><span class="mark"><bdi>@yourhandle</bdi></span><span class="swipe">اسحب <span class="arrow"></span></span></footer>
</section>

<!-- ===== EXAMPLE: last slide ===== -->
<section class="slide last" data-layout="cta">
  <div class="v v-glow at-bot-center" data-qa="bg"></div>
  <header class="bar top"><span class="pill" data-qa="text">تقنية</span><bdi dir="ltr" class="counter">7 / 7</bdi></header>
  <div class="safe center">
    <h2 class="h-l" data-qa="text">اكتب <span class="hl">API</span> بالتعليقات</h2>
    <p class="body" data-qa="text">وأرسل لك دليل البداية</p>
    <div><span class="cta-key" dir="ltr">API</span></div>
  </div>
  <footer class="bar bottom"><span class="mark"><bdi>@yourhandle</bdi></span><span class="swipe">اسحب <span class="arrow"></span></span></footer>
</section>

</body>
</html>
